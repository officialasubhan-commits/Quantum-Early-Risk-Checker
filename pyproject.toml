[project]
name = "quantum-early-risk-checker"
version = "1.0.0"
description = "Quantum-Classical Hybrid Early Risk Assessment Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.0",
    "python-multipart>=0.0.9",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "requests>=2.31.0",
    "httpx>=0.24.0",
]

[tool.vercel]
entrypoint = "backend.main:app"
